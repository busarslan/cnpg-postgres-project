apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-lab-custom-alerts
  namespace: monitoring
  labels:
    release: prometheus-community
spec:
  groups:
    - name: postgres-lab.custom
      rules:
        - alert: PostgreSQLReplicationLagHigh
          expr: cnpg_pg_replication_lag > 30
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL replikasyon gecikmesi yuksek ({{ \$labels.pod }})"
            description: "{{ \$labels.pod }} instance'inda replikasyon gecikmesi 30 saniyeyi asti. Deger: {{ \$value }}s"
