apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-lab-scheduled-backup
  namespace: database
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres-lab
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
