apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-lab
  namespace: database
spec:
  instances: 3
  bootstrap:
    initdb:
      database: myapp
      owner: busarslan
      secret:
        name: postgres-credentials
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
         cnpg.io/cluster: postgres-lab
  storage:
    size: 1Gi
